# PatchIntel PPR (Patch Priority Rating) Configuration
# Phase 2 - Additive Scoring Framework
#
# This configuration replaces the multiplicative approach with an additive 
# point-based system for more predictable and granular risk scoring.
#
# Formula: PPR = Exploitation + CVSS + AttackVector + Privilege + Impact + Exposure
# Max Score: 175 points (50+25+20+20+30+30)

# ============================================================================
# METADATA
# ============================================================================
name: "PPR Default Configuration"
version: "2.0"
created: "2025-11-15"
environment: "production"
description: "Additive Patch Priority Rating (PPR) framework - balanced for most organizations"
scoring_method: "additive"  # vs "multiplicative" (old method)

# ============================================================================
# COMPONENT A: EXPLOITATION STATUS (Most Critical - 50 points max)
# ============================================================================
# Source: Parsed from CVE impact_type field
# Examples: "Exploited:Yes", "Exploitation More Likely", "Exploitation Unlikely"
# This is the highest-impact factor - active exploitation = immediate action

exploitation_status_points:
  exploitation_detected: 50      # "Exploited:Yes" - HIGHEST PRIORITY
  exploitation_more_likely: 30   # "Exploitation More Likely" - Near-term threat
  exploitation_less_likely: 10   # "Exploitation Less Likely" - Moderate urgency
  exploitation_unlikely: 0       # "Exploitation Unlikely" - Low urgency
  unknown: 5                     # No status provided - conservative default

# Tuning Guidance:
# - High-value targets (finance, healthcare): Consider 60 for exploitation_detected
# - During active campaigns: Increase exploitation_more_likely to 40
# - Risk-averse orgs: Increase exploitation_unlikely to 5 (don't defer too much)

# ============================================================================
# COMPONENT B: CVSS BASE SCORE (Foundation - 25 points max)
# ============================================================================
# Source: cvss_base_score field (0-10)
# Binned into 4 severity categories for simplicity

cvss_score_points:
  critical:                      # 9.0 - 10.0
    min_score: 9.0
    max_score: 10.0
    points: 25
  
  high:                          # 7.0 - 8.9
    min_score: 7.0
    max_score: 8.9
    points: 15
  
  medium:                        # 4.0 - 6.9
    min_score: 4.0
    max_score: 6.9
    points: 8
  
  low:                           # 0 - 3.9
    min_score: 0.0
    max_score: 3.9
    points: 0

# Missing CVSS handling
missing_cvss_default: 5          # Conservative default when CVSS unavailable

# Tuning Guidance:
# - For more aggressive patching: Increase medium from 8 to 12
# - For tighter thresholds: Adjust bins (e.g., critical at 9.5+)

# ============================================================================
# COMPONENT C: ATTACK VECTOR (Network Exposure - 20 points max)
# ============================================================================
# Source: Parsed from CVSS vector string (AV:N, AV:A, AV:L, AV:P)
# Higher points = easier to reach = higher risk

attack_vector_points:
  network: 20                    # AV:N - Remotely exploitable (highest risk)
  adjacent: 10                   # AV:A - Adjacent network required
  local: 5                       # AV:L - Local access required
  physical: 0                    # AV:P - Physical access required (lowest risk)
  unknown: 5                     # Conservative default

# Tuning Guidance:
# - Remote workforce: Consider adjacent at 12 (local networks still exposed)
# - Data centers: Network at 25 (internet-facing is critical concern)
# - Air-gapped environments: Can lower network to 15

# ============================================================================
# COMPONENT D: PRIVILEGES REQUIRED (Access Level - 20 points max)
# ============================================================================
# Source: Parsed from CVSS vector string (PR:N, PR:L, PR:H)
# Higher points = fewer privileges needed = easier exploitation

privileges_required_points:
  none: 20                       # PR:N - No authentication needed (highest risk)
  low: 10                        # PR:L - Basic user credentials required
  high: 0                        # PR:H - Admin/privileged access required (lowest risk)
  unknown: 10                    # Conservative default

# Tuning Guidance:
# - Strict access controls: Can lower 'low' to 5
# - Weak credential management: Increase 'low' to 15
# - Zero-trust environment: Can lower 'none' to 15

# ============================================================================
# COMPONENT E: IMPACT TYPE (Severity Classification - 30 points max)
# ============================================================================
# Source: CVE severity field (Microsoft classification)
# Different impact types have different business consequences

impact_type_points:
  remote_code_execution: 30      # RCE - Complete system compromise
  elevation_of_privilege: 20     # EoP - Privilege escalation
  security_feature_bypass: 15    # SFB - Security controls bypassed
  information_disclosure: 10     # ID - Data leakage
  spoofing: 10                   # Spoofing - Identity/authentication risk
  denial_of_service: 5           # DoS - Availability impact only
  tampering: 12                  # Tampering - Data integrity risk
  unknown: 10                    # Conservative default

# Tuning Guidance:
# - Healthcare/ISPs (availability-critical): Increase DoS to 15
# - Legal/Financial (data-sensitive): Increase Info Disclosure to 15
# - Web applications: Increase Security Feature Bypass to 20

# ============================================================================
# COMPONENT F: ASSET EXPOSURE (Organizational Context - 30 points max)
# ============================================================================
# Source: asset_exposure field from asset inventory
# Higher exposure = higher organizational risk

asset_exposure_points:
  internet_facing: 30            # Public-facing assets (web servers, DMZ)
  server_domain_infra: 15        # Critical infrastructure (DC, SQL, Exchange)
  internal_workstation: 5        # Internal endpoints (laptops, desktops)
  non_critical: 0                # Test/Dev/Lab systems
  unknown: 10                    # Conservative default

# Tuning Guidance:
# - High-profile targets: Increase internet_facing to 40
# - Server-heavy infrastructure: Increase server_domain_infra to 20
# - Remote workforce: Increase internal_workstation to 10

# ============================================================================
# PRIORITY BANDS (Risk Score Ranges)
# ============================================================================
# PPR scores range from 0-175 (sum of all components)
# These bands determine patching urgency and SLAs

priority_bands:
  emergency_patch:
    min_score: 120
    max_score: 175
    label: "🔴 EMERGENCY PATCH"
    action: "Deploy immediately via out-of-cycle emergency deployment"
    sla_hours: 24
    color: "red"
    description: "Exploited vulnerabilities on critical/internet-facing assets"
    example: "Exploited RCE on internet-facing server: 50+25+20+20+30+30 = 175"
    
  high_priority:
    min_score: 80
    max_score: 119
    label: "🟠 HIGH PRIORITY"
    action: "Deploy in next scheduled maintenance window"
    sla_hours: 168      # 1 week
    color: "orange"
    description: "High CVSS with exploitation potential on important assets"
    example: "EoP with public exploit on DC: 30+15+5+10+20+15 = 95"
    
  elevated:
    min_score: 60
    max_score: 79
    label: "🟡 ELEVATED"
    action: "Deploy within current patch cycle"
    sla_hours: 336      # 2 weeks
    color: "yellow"
    description: "Moderate risk requiring timely patching"
    example: "Network-accessible RCE on internal server: 5+15+20+10+30+15 = 95"
    
  moderate:
    min_score: 40
    max_score: 59
    label: "🔵 MODERATE"
    action: "Deploy in next patch cycle or as resources permit"
    sla_hours: 720      # 30 days
    color: "blue"
    description: "Standard patches without urgent exploitation risk"
    example: "Local EoP on workstation: 10+15+5+10+20+5 = 65"
    
  low:
    min_score: 20
    max_score: 39
    label: "🟢 LOW"
    action: "Monitor and defer 2-3 cycles if needed"
    sla_hours: 2160     # 90 days
    color: "green"
    description: "Low-risk vulnerabilities, informational"
    example: "Info disclosure on test system: 0+8+5+10+10+0 = 33"
    
  informational:
    min_score: 0
    max_score: 19
    label: "⚪ INFORMATIONAL"
    action: "Optional - defer indefinitely or apply during major upgrades"
    sla_hours: null
    color: "gray"
    description: "Minimal risk, optional patching"
    example: "Low CVSS info disclosure on lab system: 0+0+5+10+10+0 = 25"

# ============================================================================
# SCORING FORMULA
# ============================================================================
scoring:
  formula: |
    PPR_SCORE = 
      exploitation_status_points
      + cvss_score_points
      + attack_vector_points
      + privileges_required_points
      + impact_type_points
      + asset_exposure_points
    
    # No capping - let score reach natural maximum
    # Maximum possible: 50 + 25 + 20 + 20 + 30 + 30 = 175
  
  cap_maximum: null              # No artificial cap
  floor_minimum: 0               # Minimum score is 0

# ============================================================================
# REPORTING OPTIONS
# ============================================================================
reporting:
  show_calculation_breakdown: true   # Show individual component scores
  include_component_values: true     # Show which specific values were used
  group_by_patch_group: true         # Organize by asset patch groups
  group_by_priority: true            # Organize by priority band
  sort_by: "ppr_score"              # Sort results by PPR score (descending)
  
  export_formats:
    - csv
    - json
    - markdown                       # Human-readable summary
  
  summary_statistics:
    - distribution_by_priority       # Count per priority band
    - top_10_risks                   # Highest PPR scores
    - by_asset_exposure              # Breakdown by exposure category
    - by_exploitation_status         # Breakdown by exploit status
    - by_patch_group                 # Breakdown by patch group

# ============================================================================
# VALIDATION & QUALITY
# ============================================================================
validation:
  warn_missing_cvss: true           # Warn when CVSS score is missing
  warn_missing_exposure: true       # Warn when asset exposure is missing
  warn_missing_vector: true         # Warn when CVSS vector components missing
  require_minimum_data_quality: 70  # Minimum asset data quality score

# ============================================================================
# PARSING RULES
# ============================================================================
# Instructions for parsing source data fields into PPR components

parsing:
  exploitation_status:
    source_field: "impact_type"
    patterns:
      exploitation_detected: ["Exploited:Yes", "Exploitation Detected"]
      exploitation_more_likely: ["Exploitation More Likely"]
      exploitation_less_likely: ["Exploitation Less Likely"]
      exploitation_unlikely: ["Exploitation Unlikely"]
    default: "unknown"
  
  attack_vector:
    source_field: "attack_vector"    # Extracted from CVSS vector
    mapping:
      "N": "network"
      "A": "adjacent"
      "L": "local"
      "P": "physical"
    default: "unknown"
  
  privileges_required:
    source_field: "privileges_required"  # Extracted from CVSS vector
    mapping:
      "N": "none"
      "L": "low"
      "H": "high"
    default: "unknown"
  
  impact_type:
    source_field: "severity"
    mapping:
      "Remote Code Execution": "remote_code_execution"
      "Elevation of Privilege": "elevation_of_privilege"
      "Security Feature Bypass": "security_feature_bypass"
      "Information Disclosure": "information_disclosure"
      "Spoofing": "spoofing"
      "Denial of Service": "denial_of_service"
      "Tampering": "tampering"
    default: "unknown"

# ============================================================================
# PRESETS (Alternative Configurations)
# ============================================================================
presets:
  balanced:
    description: "Default balanced configuration (this file)"
    use_case: "Most organizations"
  
  security_first:
    description: "Aggressive patching for high-security environments"
    modifications:
      exploitation_status_points:
        exploitation_detected: 60
        exploitation_more_likely: 40
      asset_exposure_points:
        internet_facing: 40
        server_domain_infra: 20
  
  conservative:
    description: "Lower thresholds to reduce alert fatigue"
    modifications:
      exploitation_status_points:
        exploitation_detected: 40
        exploitation_more_likely: 25
      priority_bands:
        emergency_patch:
          min_score: 140
        high_priority:
          min_score: 100
  
  availability_focused:
    description: "Prioritizes DoS and availability impacts"
    modifications:
      impact_type_points:
        denial_of_service: 20
        remote_code_execution: 25

# ============================================================================
# NOTES & TUNING GUIDANCE
# ============================================================================
#
# HOW TO TUNE THIS CONFIGURATION:
#
# 1. Start with defaults (balanced)
# 2. Run PPR calculation on historical data
# 3. Review priority band distribution:
#    - Target: 5-10% EMERGENCY, 20-30% HIGH, 40-50% MODERATE, 20-30% LOW
#    - Too many EMERGENCY? Increase min_score threshold or reduce points
#    - Too few HIGH? Decrease HIGH min_score or increase component points
# 4. Adjust incrementally (change by 5-10 points at a time)
# 5. Document changes and reasoning
# 6. Use version control to track configurations
#
# COMMON TUNING SCENARIOS:
#
# Scenario 1: "Too many EMERGENCY alerts"
#   Solution: Increase emergency_patch min_score from 120 to 130-140
#   OR: Decrease exploitation_detected from 50 to 45
#
# Scenario 2: "Missing critical patches"
#   Solution: Increase exploitation_more_likely from 30 to 40
#   OR: Increase high_priority range (lower min_score to 70)
#
# Scenario 3: "Internet-facing assets under-prioritized"
#   Solution: Increase internet_facing from 30 to 40
#
# Scenario 4: "Info disclosure too noisy"
#   Solution: Decrease information_disclosure from 10 to 5
#
# Scenario 5: "Better distinguish between local and network threats"
#   Solution: Increase network from 20 to 25, decrease local to 3
#
# ============================================================================
# VALIDATION
# ============================================================================
# Maximum theoretical score: 50 + 25 + 20 + 20 + 30 + 30 = 175
# Minimum theoretical score: 0 + 0 + 0 + 0 + 0 + 0 = 0
#
# Test cases (verify these scenarios score correctly):
#
# Test 1: Maximum Risk (Should be 175)
#   - Exploited:Yes (50) + CVSS 10.0 (25) + Network (20) + No Priv (20) + RCE (30) + Internet (30) = 175
#
# Test 2: Minimum Risk (Should be 0)
#   - Exploitation Unlikely (0) + CVSS 2.0 (0) + Physical (0) + High Priv (0) + DoS (5) + Non-critical (0) = 5
#
# Test 3: Typical High Priority (Should be ~90-100)
#   - More Likely (30) + CVSS 7.5 (15) + Local (5) + Low Priv (10) + EoP (20) + Server (15) = 95
#
# Test 4: Typical Moderate (Should be ~45-55)
#   - Less Likely (10) + CVSS 6.0 (8) + Local (5) + Low Priv (10) + Info Disc (10) + Workstation (5) = 48
#
# ============================================================================

